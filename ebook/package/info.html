<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>电子书</title>
  <style>
    :root{color-scheme:dark;--bg:#050505;--card:#101010;--line:#292929;--text:#f4f4f4;--muted:#aaa;--accent:#ffd84a;--accent2:#ffad32}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#25200e 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .page{width:min(920px,100%);margin:auto;padding:22px}.top{display:flex;justify-content:flex-end;margin-bottom:12px}.lang{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#090909}
    button{border:0;border-radius:9px;padding:7px 11px;background:transparent;color:#999;cursor:pointer}button.active{background:#29220b;color:var(--accent)}
    .hero{position:relative;overflow:hidden;display:grid;grid-template-columns:128px 1fr;gap:26px;align-items:center;padding:32px;border:1px solid #39331e;border-radius:24px;background:linear-gradient(135deg,#17150e,#0c0c0c 68%)}
    .hero:after{content:"";position:absolute;width:240px;height:240px;right:-90px;top:-110px;border-radius:50%;background:#ffd84a18;filter:blur(3px)}
    .icon{width:128px;height:128px;border-radius:28px;box-shadow:0 15px 42px #000b;object-fit:cover}.eyebrow{margin:0 0 5px;color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.16em}.hero h1{margin:0;font-size:34px;line-height:1.2}.sub{max-width:620px;margin:10px 0 15px;color:#c7c7c7}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:5px 10px;border:1px solid #40391e;border-radius:999px;background:#201c0c;color:#ffe682;font-size:12px}
    .section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}.section h2{margin:0;font-size:22px}.section-note{color:#777;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{min-height:142px;padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#121212,#0b0b0b)}.num{color:var(--accent);font-weight:800}.card h3{margin:6px 0 7px;font-size:17px}.card p{margin:0;color:var(--muted)}
    .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fact{padding:16px;border:1px solid var(--line);border-radius:15px;background:#0d0d0d}.fact b{display:block;color:var(--accent);font-size:17px}.fact span{color:#888;font-size:12px}
    .controls{padding:20px;border:1px solid #39331e;border-radius:18px;background:#141209}.controls p{margin:0;color:#cacaca}.footer{margin:28px 0 8px;text-align:center;color:#666;font-size:12px}.footer a{color:#a9923e;text-decoration:none}
    @media(max-width:640px){.page{padding:14px}.hero{grid-template-columns:76px 1fr;gap:16px;padding:22px 18px}.icon{width:76px;height:76px;border-radius:18px}.hero h1{font-size:27px}.grid{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}.section-note{display:none}}
  </style>
</head>

    'zh-TW':{eyebrow:'CLOCTECK CUBIC 閱讀器',title:'電子書',sub:'專為 320×240 小螢幕最佳化的低記憶體閱讀器。大型書籍採串流讀取，目錄及 EPUB 內容經預處理後持久快取，再次開啟無須重複掃描。',featuresTitle:'主要功能',features:[['串流閱讀','不把整本書載入記憶體，透過位元組偏移分頁，長篇書籍也能快速開啟。'],['EPUB 與插圖','網頁端解壓 EPUB，並依原文位置建立獨立圖片頁，裝置無須解析 ZIP 與 HTML。'],['持久目錄索引','首次掃描建立目錄快取；原檔未變更時直接重用，章節清單可立即顯示。'],['完整裝置操作','支援陀螺儀、機身按鍵及手把翻頁，翻過章節末頁會自動進入下一章。']],formatLabel:'支援的書籍格式',cacheLabel:'串流讀取快取',encodingLabel:'內部文字編碼',languageLabel:'介面語言',controlsTitle:'裝置操作',controls:'左右傾斜或左右鍵翻頁；手把方向鍵翻頁及選擇，A 開啟目錄或確認，START 開啟書庫或切換選單，B 返回，SELECT 或 HOME 離開。',footerText:'版本 0.4.0 · 多語言閱讀介面'},

  function norm(v){v=String(v||'').replaceAll('_','-');if(/^en(?:-|$)/i.test(v))return'en';if(/^ja(?:-|$)/i.test(v))return'ja';if(/^zh-(?:TW|HK|Hant)/i.test(v))return'zh-TW';return'zh-CN'}
  function render(lang){const key=norm(lang),c=copy[key]||copy.en;document.documentElement.lang=key;document.title=c.title;for(const id of['eyebrow','title','sub','featuresTitle','formatLabel','cacheLabel','encodingLabel','languageLabel','controlsTitle','controls','footerText'])document.getElementById(id).textContent=c[id];document.getElementById('features').innerHTML=c.features.map((x,i)=>`<article class="card"><span class="num">0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===key));localStorage.setItem('ebook-info-lang',key)}
  document.getElementById('langs').addEventListener('click',e=>{if(e.target.dataset.lang)render(e.target.dataset.lang)});
  render(localStorage.getItem('ebook-info-lang')||navigator.language);
