<h1>网易云音乐 · 原生像素设计稿</h1><p>每个画布严格为 320 × 240，无缩放。播放页：92 × 92 封面 + 5 行歌词；当前歌词 16px，其余 13px。封面为 CSS 示意图。</p>

<script>
// Sample lines are original design copy, not downloaded song lyrics.
const sample=['沿着安静的街走过','晚风轻轻靠近你我','等一场温柔的日落','把今天的心事放过','让星光慢慢地闪烁','听时间在耳边轻说','明天还有新的颜色'];
const lines=Array.from(document.querySelectorAll('.lyrics-window .line'));
let current=2,playing=false,timer=null;
document.getElementById('demo').addEventListener('click',function(){
 playing=!playing;this.textContent=playing?'暂停歌词演示':'演示歌词滚动';
 clearInterval(timer);
 if(playing)timer=setInterval(()=>{
   current=(current+1)%sample.length;
   lines.forEach((line,i)=>{line.textContent=sample[(current+i-2+sample.length)%sample.length];});
 },2200);
});
let revision=null;
async function watch(){
 if(location.protocol!=='http:'&&location.protocol!=='https:')return;
 try{
  const response=await fetch('/__revision',{cache:'no-store'});
  if(response.ok){
   const next=(await response.json()).revision;
   if(revision!==null&&next!==revision){location.reload();return;}
   revision=next;document.getElementById('preview-note').textContent='实时预览已连接 · 保存 HTML 自动刷新 · 歌词为示意内容';
  }
 }catch(error){/* A stopped local preview server must not hide the design. */}
 setTimeout(watch,1000);
}
watch();
</script>
