<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio · 屏幕设计稿</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#111;color:#eee;font:14px system-ui}main{max-width:760px;margin:auto}h1{font-size:22px;font-weight:500}p{color:#999}.device{width:320px;height:240px;background:#000;position:relative;font:13px 'Microsoft YaHei',sans-serif;margin:28px 0;outline:1px solid #292929}.brand{position:absolute;left:16px;top:12px;color:#ffa857}.clock{position:absolute;right:16px;top:12px;color:#999;font-variant-numeric:tabular-nums}.rule{position:absolute;left:16px;top:36px;width:288px;height:1px;background:#292929}.badge{position:absolute;left:16px;top:50px;width:36px;height:36px;display:grid;place-items:center;border-radius:6px;background:#21170e;color:#ffa857;font-size:24px}.status{position:absolute;left:66px;top:57px;color:#ffa857}.status:before{content:'';display:inline-block;width:6px;height:6px;background:currentColor;border-radius:50%;margin-right:8px;vertical-align:middle}.index{position:absolute;top:57px;right:16px;color:#777}.station{position:absolute;left:16px;top:98px;width:288px;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title{position:absolute;left:16px;top:137px;color:#999}.track{position:absolute;left:16px;top:201px;width:288px;height:3px;background:#252525}.fill{height:3px;width:25%;background:#ffa857}.volume-label{position:absolute;left:16px;top:177px;color:#999}.volume{position:absolute;right:16px;top:177px;color:#ffa857}.hint{position:absolute;left:16px;top:219px;color:#666;font-size:12px}.list{position:absolute;top:38px;height:171px;background:#000;width:320px;padding:7px 16px;line-height:27px}.list div.active{color:#ffa857}button{background:#202020;color:#eee;border:1px solid #444;border-radius:8px;padding:10px 16px;margin:4px}button:hover{border-color:#ffa857}</style>
<main><h1>网络收音机 · 320 × 240</h1><p>纯黑与琥珀色。静态标识，分钟时钟，无常驻动画。</p>
<div class="device"><span class="brand">RADIO</span><time class="clock">--:--</time><div class="rule"></div><span class="badge">北</span><span class="status">直播</span><span class="index">10/20</span><span class="station">北京音乐广播</span><span class="title">音乐</span><span class="volume-label">音量</span><span class="volume">25%</span><div class="track"><div class="fill"></div></div><span class="hint">左右切台　上下音量　Menu列表</span><div class="list" hidden><div>09 四川新闻广播</div><div class="active">› 10 北京音乐广播</div><div>11 上海动感101</div><div>12 上海 Love Radio</div><div>13 上海经典947</div><div>14 广东音乐之声</div></div></div>
<button id="prev">上一台</button><button id="next">下一台</button><button id="down">音量 −</button><button id="up">音量 +</button><button id="menu">Menu</button><p><a href="../package/control.html?demo=1" style="color:#ffa857">打开网页控制台设计稿 →</a></p></main>
<script>let vol=25,i=0;const names=['北京音乐广播','上海动感101','上海 Love Radio'];const q=s=>document.querySelector(s);function render(){q('.station').textContent=names[i];q('.badge').textContent=Array.from(names[i])[0];q('.index').textContent=(10+i)+'/20';q('.volume').textContent=vol+'%';q('.fill').style.width=vol+'%'}q('#prev').onclick=()=>{i=(i+2)%3;render()};q('#next').onclick=()=>{i=(i+1)%3;render()};q('#down').onclick=()=>{vol=Math.max(0,vol-5);render()};q('#up').onclick=()=>{vol=Math.min(100,vol+5);render()};q('#menu').onclick=()=>{q('.list').hidden=!q('.list').hidden};function clock(){q('.clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});setTimeout(clock,60000-Date.now()%60000)}clock();</script></html>
