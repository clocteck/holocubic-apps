<script>
  const button = document.querySelector("button");
  button.addEventListener("click", () => {
    const english = document.documentElement.lang !== "en";
    document.documentElement.lang = english ? "en" : "zh-CN";
    document.title = english ? "Cyber Aquarium" : "赛博鱼缸";
    document.querySelector("h1").textContent = document.title;
    document.querySelector("img").alt = english ? "Cyber Aquarium icon" : "赛博鱼缸图标";
    document.querySelectorAll("[data-en]").forEach(node => {
      node.textContent = english ? node.dataset.en : node.dataset.zh;
    });
    button.textContent = english ? "中文" : "EN";
    button.setAttribute("aria-label", english ? "Switch to Chinese" : "切换至英文");
  });
</script>
